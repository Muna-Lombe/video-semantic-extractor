name: Internals build and tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: python -m pip install -e './backend[dev]'
      - run: python scripts/operations/verify-engine-versions.py
      - run: python -m pytest backend/tests -q
      - name: Verify backend wheel installation
        run: |
          python -m pip wheel ./backend --no-deps --wheel-dir work/backend-wheel
          python -m venv work/wheel-smoke
          work/wheel-smoke/bin/python -m pip install work/backend-wheel/*.whl
          work/wheel-smoke/bin/python -c "from video_semantic_extractor.object_detector import NanoDet; from video_semantic_extractor.product_execution import configured_builder; from video_semantic_extractor.capsule_evaluation import score_answers; from video_semantic_extractor.capsule_comparison import compare_answers"
      - run: pnpm --dir workers install --frozen-lockfile
      - run: pnpm --dir workers test && pnpm --dir workers typecheck
      - run: node --check workers/control-plane/adjudication-web/theme.js && node --check workers/control-plane/adjudication-web/app.js && node --check workers/control-plane/adjudication-web/internals/app.js && node --check workers/control-plane/adjudication-web/internals/governance.js
      - run: npm install --prefix work/browser --no-save --package-lock=false playwright@1.64.1
      - run: work/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/operations/smoke-test-adjudicator-ui.mjs && node scripts/operations/smoke-test-ui-layout.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/work/browser/node_modules/playwright/index.mjs
      - working-directory: workers
        run: pnpm dlx wrangler@4.150.0 deploy --dry-run --outdir ../work/worker-build
      - run: docker build -f deployments/SamplingRunner.Dockerfile -t vse-runner-test .
      - run: docker build -f deployments/Dockerfile -t vse-product-test .
