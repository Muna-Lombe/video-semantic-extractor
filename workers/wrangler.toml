# @type configuration
# @purpose Configure deployment of the hosted annotation review service.
name = "video-semantic-extractor"
main = "control-plane/src/adjudication.ts"
compatibility_date = "2026-09-01"

# Resource bindings are declarative, but D1 migrations are an explicit release
# operation rather than a Worker build step. Configure the production deploy
# command as `npm run deploy:production`; see README.md for ordering and rollback
# constraints. Do not put remote mutations in a `[build]` command because Wrangler
# also runs custom builds for local development.

[assets]
directory = "./control-plane/adjudication-web"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "REVIEW_BUCKET"
bucket_name = "video-annotation-reviews"
preview_bucket_name = "video-annotation-reviews-preview"

# Private, immutable Internals inputs and outputs are deliberately isolated from
# mutable hosted-review records. Do not expose this bucket through a public URL.
[[r2_buckets]]
binding = "INTERNAL_ARTIFACTS_BUCKET"
bucket_name = "video-semantic-extractor-internal-artifacts"
preview_bucket_name = "video-semantic-extractor-internal-artifacts-preview"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "video-semantic-extractor"
database_id = "627b7ce9-4af7-4909-a1e6-8b310a28ac5a"
migrations_dir = "control-plane/migrations/control"

[[d1_databases]]
binding = "DATASET_DB"
database_name = "video-semantic-extractor-dataset"
database_id = "77adb815-acc2-47b2-a671-52df5f78e388"
migrations_dir = "control-plane/migrations/dataset"
