# @type configuration
# @purpose Configure the optional Product capsule Container Worker deployment.
name = "video-semantic-extractor-container"
main = "capsule-container/src/container.ts"
compatibility_date = "2026-09-01"

# Build and push the image from the repository root before deploying. Cloudflare
# then pulls this fully qualified image reference.
[[containers]]
class_name = "VideoSemanticExtractorContainer"
image = "../deployments/CapsuleContainer.Dockerfile"
instance_type = "basic"

[[durable_objects.bindings]]
name = "VIDEO_CONTAINER"
class_name = "VideoSemanticExtractorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VideoSemanticExtractorContainer"]