# @type configuration
# @purpose Configure the optional Product capsule Container Worker deployment.
name = "video-semantic-extractor-container"
main = "capsule-container/src/container.ts"
compatibility_date = "2026-09-01"

# Wrangler builds the shared Product API image using the repository root so
# backend/ is available to the Dockerfile's COPY instructions.
[[containers]]
class_name = "VideoSemanticExtractorContainer"
image = "../deployments/Dockerfile"
image_build_context = ".."
instance_type = "basic"

[[durable_objects.bindings]]
name = "VIDEO_CONTAINER"
class_name = "VideoSemanticExtractorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VideoSemanticExtractorContainer"]
