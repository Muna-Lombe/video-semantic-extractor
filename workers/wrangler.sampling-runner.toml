# @type configuration
# @purpose Configure the managed sampling-runner Worker and Container deployment.
name = "video-semantic-extractor-sampling-runner"
main = "sampling-runner/src/sampling-runner.ts"
compatibility_date = "2026-09-01"

[[containers]]
class_name = "SamplingRunnerContainer"
# Paths are relative to this config in workers/. The repository root is required
# as the build context because the Dockerfile copies files from backend/.
image = "../deployments/SamplingRunner.Dockerfile"
image_build_context = ".."
instance_type = "basic"

[[durable_objects.bindings]]
name = "SAMPLING_CONTAINER"
class_name = "SamplingRunnerContainer"

[[services]]
binding = "CONTROL_PLANE"
service = "video-semantic-extractor"

[triggers]
crons = ["* * * * *"]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SamplingRunnerContainer"]
